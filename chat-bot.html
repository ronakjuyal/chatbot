<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
      body{
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .app-container{
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;

        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .chat-input-container{
        display: flex;
        margin-bottom: 60px;
      }
      .chat-input{
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;

      }
      .send-button{
        padding: 12px 15px;
        border-radius: 10px;
        border: none;
        background-color: rgb(81, 153, 102);
        margin-left: 10px;
        cursor: pointer;
      }
      .chat-message-user{
        display: flex;
        justify-content: end;
        align-items: start;
      }
      .chat-message-robot{
        display: flex;
        align-items: start;
      }
      .chat-message-text{
        background-color: rgb(237, 237, 237);
        border-radius: 10px;
        padding: 15px 20px;
        margin-left: 10px;
        margin-right: 10px;
        max-width: 300px;
        margin-bottom: 20px;
      }
      .chat-messages-container{
        flex-grow:1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({chatMessages,setChatMessages}){
        const [inputText, setInputText] = React.useState('');
        function saveInputText(event){
          //console.log(event.target.key)
          // if(event.key==='Enter'){
          //   sendMessage();
          //   return;
          // }
          setInputText(event.target.value);
        }
        async function sendMessage(){
          const newChatArray=[...chatMessages,{
                                              sender:'user', 
                                              message:inputText, 
                                              id:crypto.randomUUID()
                                            },{
                                              sender:'robot', 
                                              message:'Loading......', 
                                              id:crypto.randomUUID()
                                            }
          ];
          setChatMessages(newChatArray);
          setInputText('');                                   
          const response = await Chatbot.getResponseAsync(inputText);
          setChatMessages([...newChatArray.slice(0,newChatArray.length-1),
                            {
                              sender:'robot', 
                              message:response, 
                              id:crypto.randomUUID()
                            }
          ]);
        }
        function handleKeyDown(event) {
          if (event.key === 'Enter') {
            sendMessage();
          }
          else if(event.key === 'Escape'){
            setInputText('');
          }
        }
        return(
          <div className="chat-input-container">
            <input  type="text" 
                    placeholder="Send a message to ChatBot" 
                    onChange={saveInputText}
                    onKeyDown={handleKeyDown}
                    value={inputText}
                    className="chat-input"
                    />
            <button onClick={sendMessage} className="send-button">Send</button>
          </div>
        );
      }
      
      function ChatMessage({sender, message}){
        return(
          <div className={sender==='user'?"chat-message-user":"chat-message-robot"}>
            {sender==='robot' && (<img src="robot.png" width="50" />)}
            <div className="chat-message-text">{message}</div>
            {sender==='user' && (<img src="user.png" width="50" />)}
          </div>
        );
      }

      function ChatMessages({chatMessages}){
        const chatMessagesRef=React.useRef(null);
        React.useEffect(()=>{
          const containerEle=chatMessagesRef.current;
          if(containerEle){
            containerEle.scrollTop=containerEle.scrollHeight;
          }
        });
        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
          {chatMessages.map((chatMessage)=>{
            return (
              <ChatMessage
                sender={chatMessage.sender}
                message={chatMessage.message}
                key={chatMessage.id}
              />
            );
          })}
          </div>
        );  
      }
      function App(){
        const [chatMessages,setChatMessages] = React.useState([{
            sender:'user' ,
            message:'hello',
            id:'id1'
          },{
            sender:'robot' ,
            message:'hello, how are you',
            id:'id2'
          },{
            sender:'user' ,
            message:'i m great',
            id:'id3'
          },{
            sender:'robot' ,
            message:'how can i help you',
            id:'id4'
          }]);
        return(
          <div className="app-container">
            <ChatMessages
              chatMessages={chatMessages}
            />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }
      const container = document.querySelector('.js-container');
      
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
